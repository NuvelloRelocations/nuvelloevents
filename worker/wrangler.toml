name = "beyond-arrival-rsvp"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

# Secrets, set with `npx wrangler secret put <NAME>` (never written here):
#   SMTP_PASS         password of the sending mailbox
#   TURNSTILE_SECRET  secret key of the Turnstile widget
[vars]
SMTP_HOST = "smtp.office365.com"
SMTP_PORT = "587"
SMTP_USER = "AI@nuvellorealestate.ae"
RSVP_TO = "relocation@nuvellorealestate.ae"
ALLOWED_ORIGINS = "https://nuvellorelocations.github.io"
TURNSTILE_HOSTNAME = "nuvellorelocations.github.io"

TURNSTILE_ACTION = "rsvp"
# Strict limits, counted in a Durable Object (src/limiter.js)
LIMIT_PER_IP_PER_MINUTE = "5"
LIMIT_PER_EMAIL_PER_HOUR = "3"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "RsvpLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RsvpLimiter"]
